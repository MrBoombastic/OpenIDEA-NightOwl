# OpenIDEA Theme Plugin: Night Owl
id = "mrboombastic.night-owl"
name = "Night Owl"
version = "1.0.2"
description = "A port of Sarah Drasner's acclaimed Night Owl theme, copied directly from IntelliJ IDEA (Material Theme UI)."
authors = ["MrBoombastic", "Sarah Drasner", "Elior Boukhobza (Mallowigi)"]
license = "MIT"
change-notes = "1.0.2 — Syntax colours now match IntelliJ Night Owl / Light Owl: italic built-ins, TODO and attributes, parameter, decorator, docstring, bracket and comma colours fixed, Python method calls and constants plain; plugin icon. 1.0.1 — Night Owl: muted success/warning colours so badges (Signed by, permission risk) are no longer glaring and white text on them is readable. 1.0.0 — Initial release: Night Owl and Light Owl ported from IntelliJ IDEA."
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
engines.openidea = "^1.2"
categories = ["themes"]

[[contributes.themes]]
path = "themes/night-owl.theme.json"
editor-scheme = "themes/night-owl.scheme.json"

[[contributes.themes]]
path = "themes/light-owl.theme.json"
editor-scheme = "themes/light-owl.scheme.json"
